name: Codestra Governed Promotion

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - development
      - testing
      - staging
      - production
      - 'section/**'

permissions:
  contents: read

jobs:
  promotion-guard:
    name: promotion-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate hierarchy promotion path
        run: python3 governance/promotion_guard.py --head "${{ github.head_ref }}" --base "${{ github.base_ref }}"
