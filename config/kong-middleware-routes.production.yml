_format_version: '3.0'
_transform: true
plugins:
- name: codestra-private-surface
  config:
    allow_private: false
    private_paths:
    - /api/v1/integration/automation-results
    - /api/v1/integration/campaigns/actual-state
upstreams:
- name: middleware-integration-api
  targets:
  - target: middleware-integration-api:8095
    weight: 100
  healthchecks:
    passive:
      type: http
      healthy:
        successes: 2
      unhealthy:
        http_statuses:
        - 500
        - 502
        - 503
        - 504
        http_failures: 3
        tcp_failures: 2
        timeouts: 2
    active:
      type: http
      http_path: /readyz
      healthy:
        interval: 10
        successes: 2
      unhealthy:
        interval: 5
        http_failures: 2
        tcp_failures: 2
        timeouts: 2
services:
- name: middleware-integration-api
  host: middleware-integration-api
  port: 8095
  protocol: http
  tags:
  - codestra.environment.production
  - codestra.runtime-apply-authorized.false
  - codestra.provider-effects-enabled.false
  - codestra.contract.middleware-public-api-route-contract
  connect_timeout: 5000
  read_timeout: 30000
  write_timeout: 30000
  retries: 0
  routes:
  - name: middleware-check-automation-policy
    hosts:
    - api.codestra.co
    paths:
    - ~/api/v1/automation/policy\-check$
    regex_priority: 4
    methods:
    - POST
    protocols:
    - http
    strip_path: false
    preserve_host: true
    path_handling: v0
    tags:
    - codestra.classification.shared_edge
    - codestra.operation.middleware-check-automation-policy
    plugins:
    - name: codestra-private-surface
      config:
        allow_private: false
    - name: codestra-resource-guard
      config:
        route_key: middleware-check-automation-policy
        concurrency_limit_per_worker: 32
        tenant_quota_per_minute: 0
    - name: codestra-request-context
      config:
        require_correlation_id: false
    - name: pre-function
      config:
        access:
        - "-- Clear client-supplied identity before openid-connect runs.\nfor _, name in ipairs({\"X-User-ID\", \"X-Username\", \"X-Email\", \"X-Roles\", \"X-Scopes\", \"X-Authenticated-UserID\", \"X-Authenticated-User\", \"X-Authenticated-Client\", \"X-Authenticated-Subject\", \"X-Authenticated-Tenant\", \"X-Authenticated-Campaign\", \"X-Authenticated-Role\", \"X-Authenticated-Email\", \"X-Codestra-Tenant\", \"X-Codestra-Scopes\", \"X-Codestra-Gateway-Secret\", \"X-Internal-Service\", \"X-Admin\", \"X-Codestra-Contract-Operation\", \"X-Codestra-Expected-Azp\", \"X-Codestra-Required-Scope\", \"X-Consumer-ID\", \"X-Consumer-Username\", \"X-Credential-Identifier\", \"X-Anonymous-Consumer\"}) do\n  kong.service.request.clear_header(name)\nend"
    - name: openid-connect
      config:
        issuer: https://auth.codestra.co/realms/codestra/.well-known/openid-configuration
        auth_methods:
        - bearer
        audience:
        - middleware-api
        audience_required:
        - middleware-api
        issuers_allowed:
        - https://auth.codestra.co/realms/codestra
        bearer_token_param_type:
        - header
        verify_signature: true
        verify_claims: true
        ssl_verify: true
        enable_hs_signatures: false
        ignore_signature: []
        introspect_jwt_tokens: false
        display_errors: false
        consumer_by:
        - username
        consumer_optional: false
        cache_ttl: 300
        cache_ttl_max: 300
        rediscovery_lifetime: 30
        leeway: 0
        scopes_required:
        - n8n.policy.check
        consumer_claim:
        - azp
        roles_claim:
        - azp
        roles_required:
        - n8n-automation
        groups_claim:
        - amr
        groups_required:
        - client_credentials
        cache_tokens_salt: '{vault://env/kong-oidc-cache-tokens-salt}'
    - name: codestra-authz
      config:
        mode: contract
        operation_id: check_automation_policy
        expected_azp: n8n-automation
        required_scope: n8n.policy.check
        allowed_azps:
        - n8n-automation
    - name: correlation-id
      config:
        header_name: X-Correlation-ID
        generator: uuid
        echo_downstream: true
    - name: rate-limiting
      config:
        minute: 120
        second: 10
        error_code: 429
        error_message: rate_limit_exceeded
        policy: redis
        fault_tolerant: false
        hide_client_headers: false
        redis:
          host: codestra-redis
          port: 6379
          database: 0
          timeout: 2000
          password: '{vault://env/kong-rate-limit-redis-password}'
    - name: request-size-limiting
      config:
        allowed_payload_size: 2
  - name: middleware-list-callbacks
    hosts:
    - api.codestra.co
    paths:
    - ~/api/v1/callbacks$
